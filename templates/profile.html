{% extends "base.html" %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10">
  <h1 class="text-2xl font-bold text-slate-800 mb-6">Profil Saya</h1>
  <form method="POST" class="bg-white shadow-md rounded-xl p-6 space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-600">Nama</label>
      <input type="text" name="name" value="{{ current_user.name }}" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-400">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-600">Email</label>
      <input type="email" value="{{ current_user.email }}" disabled class="w-full border border-slate-200 rounded-lg p-2.5 bg-gray-100 text-slate-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-600">Peran</label>
      <input type="text" value="{{ 'Administrator' if current_user.role == 'admin' else 'Staff' }}" disabled class="w-full border border-slate-200 rounded-lg p-2.5 bg-gray-100 text-slate-500">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition">Simpan Perubahan</button>
  </form>
</div>
{% endblock %}
