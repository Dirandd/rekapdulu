<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — REKAP DULU</title>
  <link href="{{ url_for('static', filename='dist/output.css') }}" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .bg-main { background: linear-gradient(135deg, #0a0f1e 0%, #0f1a35 50%, #0d1f2d 100%); }
    .card { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(20px); }
    .input-field {
      width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: .625rem; padding: .625rem 1rem; color: #fff; font-size: .875rem;
      outline: none; transition: all .2s;
    }
    .input-field::placeholder { color: rgba(255,255,255,.3); }
    .input-field:focus { border-color: rgba(96,165,250,.6); background: rgba(255,255,255,.09); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .btn-login {
      width: 100%; padding: .75rem; border-radius: .625rem;
      background: linear-gradient(135deg, #1D4ED8, #1e40af);
      color: #fff; font-weight: 700; font-size: .9rem;
      border: none; cursor: pointer; transition: all .2s;
      box-shadow: 0 4px 15px rgba(37,99,235,.4);
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,.5); }
    .btn-login:active { transform: translateY(0); }
    /* Animated dots background */
    .dot { position: absolute; border-radius: 50%; animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-20px) scale(1.05)} }
  </style>
</head>
<body class="bg-main min-h-screen flex items-center justify-center relative overflow-hidden">

  <!-- Background decorations -->
  <div class="dot w-64 h-64 opacity-5" style="background:radial-gradient(circle,#3B82F6,transparent);top:-5%;left:-5%;animation-delay:0s"></div>
  <div class="dot w-96 h-96 opacity-5" style="background:radial-gradient(circle,#DC2626,transparent);bottom:-10%;right:-10%;animation-delay:2s"></div>
  <div class="dot w-48 h-48 opacity-5" style="background:radial-gradient(circle,#16A34A,transparent);top:40%;left:5%;animation-delay:4s"></div>

  <div class="relative z-10 w-full max-w-sm mx-4">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <!-- SVG Logo -->
        <svg width="52" height="52" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="30" height="30" rx="8" fill="url(#lg-login)"/>
          <rect x="5" y="17" width="4" height="8" rx="1" fill="#4ADE80" opacity=".9"/>
          <rect x="11" y="12" width="4" height="13" rx="1" fill="#60A5FA" opacity=".9"/>
          <rect x="17" y="7" width="4" height="18" rx="1" fill="#F87171" opacity=".9"/>
          <polyline points="7,17 13,12 19,7 23,4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
          <circle cx="23" cy="4" r="1.5" fill="white" opacity=".9"/>
          <defs>
            <linearGradient id="lg-login" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1D4ED8"/>
              <stop offset="50%" stop-color="#0f172a"/>
              <stop offset="100%" stop-color="#166534"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 style="color:#fff;font-size:1.6rem;font-weight:900;letter-spacing:.06em;margin:0">REKAP DULU</h1>
      <p style="color:rgba(255,255,255,.35);font-size:.75rem;margin-top:4px;letter-spacing:.04em">SISTEM TIKET & MANAJEMEN PROFIT</p>
    </div>

    <!-- Card -->
    <div class="card rounded-2xl p-7">
      <h2 style="color:rgba(255,255,255,.85);font-size:.95rem;font-weight:600;margin-bottom:1.5rem;text-align:center">
        Masuk ke Akun Anda
      </h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat, msg in messages %}
          <script>Swal.fire({icon:'{{ "success" if cat=="success" else "error" }}',title:'{{ msg }}',timer:3000,showConfirmButton:false});</script>
        {% endfor %}{% endif %}
      {% endwith %}

      <form method="POST" class="space-y-4">
        <div>
          <label style="display:block;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">Email</label>
          <input type="email" name="email" required autocomplete="email"
                 class="input-field" placeholder="email@contoh.com">
        </div>
        <div>
          <label style="display:block;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">Password</label>
          <div style="position:relative">
            <input type="password" name="password" id="pwdField" required
                   class="input-field" placeholder="••••••••" style="padding-right:2.75rem">
            <button type="button" onclick="togglePwd()" tabindex="-1"
                    style="position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);padding:2px">
              <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
          <div style="text-align:right;margin-top:.4rem">
            <a href="{{ url_for('forgot_password') }}" style="font-size:.72rem;color:rgba(96,165,250,.7);transition:color .2s" onmouseover="this.style.color='#60A5FA'" onmouseout="this.style.color='rgba(96,165,250,.7)'">
              Lupa password?
            </a>
          </div>
        </div>
        <div style="padding-top:.25rem">
          <button type="submit" class="btn-login">Masuk →</button>
        </div>
      </form>
    </div>

    <p style="text-align:center;color:rgba(255,255,255,.2);font-size:.7rem;margin-top:1.5rem;">
      © 2026 REKAP DULU · Sistem Tiket & Profit Agensi
    </p>
  </div>

<script>
function togglePwd(){
  const f = document.getElementById('pwdField');
  f.type = f.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
